name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (frozen)
        run: uv sync --frozen
      - name: Tests (includes the Action metadata contract test)
        run: uv run pytest -q
